# ===========================================================================
# Continuous Integration: lint + test on every push and pull request.
#
# This is part of the "I operate software, not just write it" story — the same
# quality gate a reviewer would expect runs automatically. It works because the
# whole test suite is designed to run offline with no secrets (the diagnostic
# agent falls back to its rule-based path when ANTHROPIC_API_KEY is absent).
# ===========================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]  # prove it works across versions

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Run tests
        run: pytest -q
