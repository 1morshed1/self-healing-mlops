# ===========================================================================
# Project metadata + build configuration.
#
# Installing in editable mode makes `import mlops` work from anywhere:
#     pip install -e .
# The `src/` layout (package under src/mlops) is deliberate: it prevents the
# accidental "it imports because I'm in the repo root" bug and forces you to
# test against the *installed* package, exactly like a user would get it.
# ===========================================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-mlops"
version = "0.1.0"
description = "End-to-end ML pipeline with drift detection, self-healing retraining, and an LLM diagnostic agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Runtime deps are duplicated in requirements.txt with explanatory comments;
# this list is what `pip install -e .` uses.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "mlflow>=2.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
    "anthropic>=0.39",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest: make `src/` importable and keep test output readable.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

# ---------------------------------------------------------------------------
# ruff: lint + format. Line length 100 is a comfortable middle ground.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # errors, pyflakes, isort, pyupgrade, bugbear
